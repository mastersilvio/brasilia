<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">BRASILIA — Brasil mais IA</title>
  <desc id="desc">Logo em fundo azul escuro com a palavra BRASILIA; BRA em verde, SIL em amarelo e IA em azul.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop offset="0" stop-color="#071b35"/>
      <stop offset="1" stop-color="#12375a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="32" fill="url(#background)"/>
  <rect width="1200" height="360" rx="32" fill="url(#grid)"/>
  <path d="M72 74h58M72 74v58M1128 286h-58M1128 286v-58" fill="none" stroke="#42d99a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1072" cy="89" r="6" fill="#f8d34f"/>
  <circle cx="1097" cy="89" r="6" fill="#42d99a"/>
  <circle cx="1122" cy="89" r="6" fill="#f8d34f"/>
  <text x="600" y="223" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" letter-spacing="-8"><tspan fill="#42d99a">BRA</tspan><tspan fill="#f8d34f">SIL</tspan><tspan fill="#55aaff">IA</tspan></text>
  <path d="M244.5 255h711" stroke="#55aaff" stroke-width="7" stroke-linecap="round"/>
  <text x="600" y="304" text-anchor="middle" fill="#bdcfe0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" letter-spacing="4">INTELIGÊNCIA ARTIFICIAL · SOBERANIA DE DADOS</text>
</svg>
